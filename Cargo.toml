[workspace]

resolver = "3"
members = [
    "riichi",
    "riichi-analysis",
    "riichi-decomp",
    "riichi-decomp-table",
    "riichi-elements",
    "tenhou-db",
    "tenhou-shuffle",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
itertools = "0.15"
nanovec = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.5"
serde_json = "1.0"
serde_tuple = "1.1"
serde_with = "3.25"
strum = { version = "0.28", features = ["derive"] }
phf = { version = "0.14", features = ["macros"] }
phf_codegen = { version = "0.14" }
