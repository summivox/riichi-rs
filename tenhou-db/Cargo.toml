[package]
name = "tenhou-db"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
camino = "1"
chrono = "0.4"
chrono-tz = "0.10"
flate2 = "1"
hex = "0.4.3"
indicatif = "0.18"
itertools.workspace = true
log = "0.4"
once_cell = "1"
regex = "1"
replace_with = "0.1.8"
reqwest = { version = "0.13", features = ["blocking", "gzip"] }
rusqlite = { version = "0.43", features = ["bundled", "chrono"] }
sha2 = "0.11"
url = "2.5"
zip = "9.8"

# CLI only
clap = { version = "4.6", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }

# workspace
anyhow = { workspace = true }

# internal
riichi-elements = { path = "../riichi-elements", features = ["serde"] }

[features]
default = ["cli"]

cli = ["clap", "env_logger"]


[[bin]]
name = "main"
required-features = ["cli"]
